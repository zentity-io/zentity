# Build, test, and deploy zentity for each supported version of Elasticsearch whenever pushing a release tag.
name: Deploy
on:
  push:
    tags:
      - "zentity-*.*.*"
      - "zentity-*.*.*-*"

jobs:
  create_release:
    name: Create Release

    # Use the latest LTS OS.
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.get_tag.outputs.tag }}
      zentity_version: ${{ steps.get_zentity_version.outputs.version }}
      prerelease: ${{ steps.get_tag.outputs.prerelease }}
    steps:

      # Checkout the repository.
      # Uses: https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Get the release tag.
      - name: Get release tag
        id: get_tag
        run: |
          echo "tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') || contains(github.ref, 'experimental') }}" >> "$GITHUB_OUTPUT"

      # Get the zentity version by excluding the zentity- prefix in the release tag.
      - name: Get zentity version
        id: get_zentity_version
        env:
          RELEASE_TAG: ${{ steps.get_tag.outputs.tag }}
        run: echo "version=${RELEASE_TAG#zentity-}" >> "$GITHUB_OUTPUT"

  build_and_upload_artifacts:
    name: Build and Upload Artifacts
    needs: create_release
    permissions:
      contents: write

    # Use the latest LTS OS.
    runs-on: ubuntu-22.04

    # Set the zentity version as the value of the release tag.
    env:
      ZENTITY_VERSION: ${{ needs.create_release.outputs.zentity_version }}
    strategy:

      # Build and test zentity for each version of Elasticsearch that its APIs support.
      matrix:
        elasticsearch:
          - 9.0.0
    steps:

      # Checkout the repository.
      # Uses: https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Configure the JDK.
      # Uses: https://github.com/actions/setup-java
      # Elasticsearch JVM support matrix: https://www.elastic.co/support/matrix#matrix_jvm
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Cache Maven packages.
      # Uses: https://github.com/actions/cache
      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Build and test zentity for a given version of Elasticsearch.
      - name: Build and test
        env:
          ELASTICSEARCH_VERSION: ${{ matrix.elasticsearch }}
        run: mvn --batch-mode clean install -Dzentity.version=$ZENTITY_VERSION -Delasticsearch.version=$ELASTICSEARCH_VERSION --file pom.xml

      # Set the artifact name using the given versions of zentity and Elasticsearch.
      - name: Set artifact name
        id: set_artifact_name
        env:
          ELASTICSEARCH_VERSION: ${{ matrix.elasticsearch }}
        run: echo "name=zentity-$ZENTITY_VERSION-elasticsearch-$ELASTICSEARCH_VERSION.zip" >> "$GITHUB_OUTPUT"

      # Create (or update) the release and upload the release asset to: https://github.com/zentity-io/zentity/releases
      # Uses: https://github.com/softprops/action-gh-release
      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create_release.outputs.release_tag }}
          name: ${{ needs.create_release.outputs.release_tag }}
          prerelease: ${{ needs.create_release.outputs.prerelease }}
          body: "Releasing zentity-${{ needs.create_release.outputs.zentity_version }}"
          files: ./target/releases/${{ steps.set_artifact_name.outputs.name }}